name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-wrapper:
    name: Build Twain.Wia.Sane.Scanner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The wrapper is a plain net8.0 library — no MAUI workload needed.
      - name: Build
        run: dotnet build Twain.Wia.Sane.Scanner/Twain.Wia.Sane.Scanner.csproj -c Release

  documentbarcode:
    name: Build documentbarcode MAUI sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build
        # Only the Windows target is built: the sample talks to a scanner service
        # running on the same PC, and Android/iOS would need their own workloads.
        run: >
          dotnet build examples/documentbarcode/documentbarcode.csproj
          -c Release
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
